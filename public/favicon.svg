<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c28" />
      <stop offset="100%" stop-color="#0c0c10" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ba2ff" />
      <stop offset="100%" stop-color="#c4b0fc" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ba2ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7048e8" stop-opacity="0.4" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="14" />

  <!-- Ambient Glow Behind Text -->
  <circle cx="256" cy="256" r="170" fill="url(#accentGrad)" opacity="0.3" filter="url(#glow)" />

  <!-- Extra Large Monogram Initials RP -->
  <text x="256" y="348" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" 
        font-size="290" 
        font-weight="900" 
        letter-spacing="-6" 
        fill="url(#accentGrad)" 
        text-anchor="middle">RP</text>
</svg>